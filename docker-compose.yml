# Full-Stack Docker Compose Orchestration
# Note: Place this file in the parent directory containing both backend and frontend repositories.
# If cloned repository folders are named campuscare-backend and campuscare-frontend, 
# adjust the context and volume paths accordingly.

services:
  backend:
    build:
      context: ./campuse_care-backend
      dockerfile: Dockerfile
    container_name: campuscare-backend
    ports:
      - "8000:8000"
    volumes:
      - ./campuse_care-backend/app:/app/app
    env_file:
      - ./campuse_care-backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./campuscare-react/campuscare-react
      dockerfile: Dockerfile
    container_name: campuscare-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./campuscare-react/campuscare-react:/app
      - /app/node_modules
    env_file:
      - ./campuscare-react/campuscare-react/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
    depends_on:
      - backend
